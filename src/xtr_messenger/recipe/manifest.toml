# The recipe for xtr-messenger: what *Use in an application* in the README
# takes, as data. Keep the two in step — the README is the source.

[bundles]
# "<module>:<class>" = the environments it is listed with, exactly as in BUNDLES.
"xtr_messenger.bundle:MessengerBundle" = { all = true }

[files]
# Destination under the application package = template under this recipe.
# Needed to move a message: with no configuration there are no transports.
"config/packages/messenger.py" = "files/config/messenger.py.tmpl"

[env]
# The broker DSN the written configuration reads: a RabbitMQ on this machine
# with its stock account, for the amqp extra. Read when the bus is built, not
# when the application boots; change it, or put the real one in .env.local.
MESSENGER_DSN = "amqp://guest:guest@127.0.0.1:5672/?queue=messages"

[gitignore]
lines = []

[notes]
steps = [
  "Name the transports in config/packages/messenger.py and route your messages to them: a message routed nowhere is neither sent nor handled.",
  "MESSENGER_DSN points at a RabbitMQ on this machine, which the amqp extra reaches (uv add \"xtr-messenger[amqp]\"). The broker needs the rabbitmq_delayed_message_exchange plugin for delays and retry backoff, or add delayed_message_exchange_plugin=false to the DSN.",
]
check = [
  "<script> debug:bundles — messenger is listed and active",
  "<script> debug:config messenger — the resolved transports and routing",
]
run = ["<script> messenger:consume <transport>"]
